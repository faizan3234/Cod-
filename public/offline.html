<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  /><meta name="theme-color" content="#f6f7f2" /><title>
    Offline · Solo League</title
  ><style>
    body {
      margin: 0;
      background: #f6f7f2;
      color: #26352b;
      font: 16px/1.7 system-ui;
      min-height: 100svh;
      display: grid;
      place-items: center;
    }
    main {
      max-width: 360px;
      padding: 32px;
    }
    small {
      letter-spacing: 2px;
      color: #75845f;
    }
    h1 {
      font-size: 36px;
      line-height: 1.1;
    }
    button {
      display: inline-flex;
      border: 0;
      font: inherit;
      cursor: pointer;
      background: #dcedb6;
      color: #26352b;
      padding: 14px 24px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 700;
    }
    p {
      color: #606d5d;
    }
  </style>
  <main>
    <small>COD SOLO LEAGUE</small>
    <h1>Back in a moment.</h1>
    <p>
      You’re offline. Posted results remain saved. Reconnect to see the league
      and resume any saved scoreboard draft.
    </p>
    <form action="/" method="get">
      <button type="submit">Try again</button>
    </form>
  </main>
</html>
